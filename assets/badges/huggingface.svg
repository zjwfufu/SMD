<svg xmlns="http://www.w3.org/2000/svg" width="116" height="20" viewBox="0 0 116 20" role="img" aria-label="Hugging Face">
  <title>Hugging Face</title>
  <defs>
    <clipPath id="rounded"><rect width="116" height="20" rx="3"/></clipPath>
    <linearGradient id="surface" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity=".05"/></linearGradient>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="116" height="20" fill="#ffda54"/>
    <rect width="22" height="20" fill="#555"/>
    <rect width="116" height="20" fill="url(#surface)"/>
  </g>
  <text x="11" y="14" fill="#ffe16b" text-anchor="middle" font-family="Verdana,sans-serif" font-size="10" font-weight="bold">HF</text>
  <text x="69" y="14" fill="#493c14" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" textLength="82" lengthAdjust="spacingAndGlyphs">Hugging Face</text>
</svg>
